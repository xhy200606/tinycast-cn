name: Tinycast · 中文版手动云编译
run-name: "Tinycast ${{ inputs.version }} · ${{ inputs.architecture }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v）"
        type: string
        default: "0.11.12"
        required: true
      architecture:
        description: "目标架构"
        type: choice
        options: [universal, arm64]
        default: universal
      confirmed:
        description: "我已检查汉化改动，确认开始编译"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: tinycast-cn-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirmed == true
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUILD_VERSION: ${{ inputs.version }}
      BUILD_ARCHITECTURE: ${{ inputs.architecture }}
      APP_NAME: Tinycast
      APP_BUNDLE_ID: com.tinycast.app
    steps:
      - uses: actions/checkout@v4

      - name: Validate build parameters
        run: |
          [[ "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          case "$BUILD_ARCHITECTURE" in
            universal) echo 'BUILD_ARCHS=arm64 x86_64' >> "$GITHUB_ENV" ;;
            arm64) echo 'BUILD_ARCHS=arm64' >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          test -n "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install project and lint tools
        run: brew install xcodegen swiftlint

      - name: Regenerate Xcode project
        run: xcodegen generate

      - name: Check localization and lint
        run: ./Scripts/lint.sh

      - name: Verify pure model boundaries
        run: |
          if rg -n 'import (AppKit|SwiftUI|Cocoa)' Tinycast/Features/*/Model/; then
            exit 1
          fi

      - name: Run regression harnesses
        env:
          TMPDIR: ${{ runner.temp }}
          TINYCAST_TEST_JOBS: '3'
        run: ./Scripts/run-tests.sh

      - name: Build Debug
        run: |
          set -o pipefail
          mkdir -p build/logs
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/Debug" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/logs/debug.log

      - name: Verify Xcode localization extraction
        run: ./Scripts/check-localization.sh --extract

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/Release" \
            ARCHS="$BUILD_ARCHS" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            PRODUCT_NAME="$APP_NAME" PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            MARKETING_VERSION="$BUILD_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build 2>&1 | tee build/logs/release.log

      - name: Verify resources and architectures, then sign locally
        run: |
          APP="$RUNNER_TEMP/Release/Build/Products/Release/$APP_NAME.app"
          for BIN in "$APP/Contents/MacOS/$APP_NAME" "$APP/Contents/Helpers/ClipboardTextHelper"; do
            SLICES="$(lipo -archs "$BIN")"
            for ARCH in $BUILD_ARCHS; do
              [[ " $SLICES " == *" $ARCH "* ]] || exit 1
            done
            if [ "$BUILD_ARCHITECTURE" = arm64 ]; then test "$SLICES" = arm64; fi
          done
          test -f "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings"
          test -f "$APP/Contents/Resources/zh-Hans.lproj/InfoPlist.strings"
          plutil -lint "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings"
          codesign --force --sign - --options runtime "$APP/Contents/Helpers/ClipboardTextHelper"
          codesign --force --sign - --options runtime --entitlements Tinycast/Tinycast.entitlements "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package application
        run: |
          APP="$RUNNER_TEMP/Release/Build/Products/Release/$APP_NAME.app"
          NAME="Tinycast-$BUILD_ARCHITECTURE-$BUILD_VERSION"
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE" dist
          ditto "$APP" "$STAGE/$APP_NAME.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE" -ov -format UDZO "dist/$NAME.dmg"
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/$NAME.zip"
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Source: $SOURCE_SHA"
            echo "Version: $BUILD_VERSION"
            echo "Architectures: $BUILD_ARCHS"
            echo "Signing: ad-hoc (not notarized; manual updates)"
          } > dist/BUILD-INFO.txt
          shasum -a 256 dist/*.dmg dist/*.zip > dist/SHA256SUMS.txt
          {
            echo '### 中文版安装包'
            echo "源码提交：\`$SOURCE_SHA\`"
            echo '下载本次运行的 Artifacts，解压后将 Tinycast.app 拖到“应用程序”。'
            echo '本包使用临时签名，未公证；更新需手动下载。若系统阻止首次打开：'
            echo '`xattr -dr com.apple.quarantine "/Applications/Tinycast.app"`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload install packages
        uses: actions/upload-artifact@v4
        with:
          name: Tinycast-${{ inputs.architecture }}-${{ inputs.version }}-${{ github.run_number }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tinycast-logs-${{ inputs.architecture }}-${{ github.run_number }}
          path: |
            build/logs/
            ${{ runner.temp }}/tinycast-harness/*.log
          retention-days: 14
          if-no-files-found: ignore
